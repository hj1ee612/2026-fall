<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>서울 로컬픽</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: one column. Schematic Seoul map on top, numbered pins match the numbered cards below. */
  --bg:#EFF1F3; --card:#FFFFFF; --ink:#101828; --muted:#566074; --line:#D5DAE1; --on:#FFFFFF;
  --land:#E3E7EB; --water:#B7D3EA; --waterink:#4F7BA3;
  --c-eat:#D83A2E; --c-do:#1F6FD6; --c-cvs:#138A4B; --c-oy:#9A6412; --c-saved:#101828; --c-rank:#7A3FC4;
  --f-display:'Black Han Sans','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-body:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E131B; --card:#171E29; --ink:#F1F4F8; --muted:#A3AEC0; --line:#2A3443; --on:#0E131B;
    --land:#1B2431; --water:#27496B; --waterink:#8FB6DA;
    --c-eat:#FF7467; --c-do:#6BA6FF; --c-cvs:#43CF86; --c-oy:#E8B04A; --c-saved:#F1F4F8; --c-rank:#B98CF0;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E131B; --card:#171E29; --ink:#F1F4F8; --muted:#A3AEC0; --line:#2A3443; --on:#0E131B;
  --land:#1B2431; --water:#27496B; --waterink:#8FB6DA;
  --c-eat:#FF7467; --c-do:#6BA6FF; --c-cvs:#43CF86; --c-oy:#E8B04A; --c-saved:#F1F4F8; --c-rank:#B98CF0;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.pin:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 48px}

.top{display:flex;align-items:center;justify-content:space-between;padding:16px 0 4px;gap:8px}
.brand{font-family:var(--f-display);font-size:20px;white-space:nowrap}
.brand small{font-family:var(--f-body);font-weight:600;font-size:11px;letter-spacing:.14em;color:var(--muted);margin-left:8px}
.lang{display:flex;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden;flex:0 0 auto}
.lang button{border:0;background:transparent;padding:4px 12px;font-size:13px;font-weight:600;min-height:32px}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

.hero{padding:16px 0 4px}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(30px,9vw,48px);line-height:1.12;margin:0 0 8px;text-wrap:balance}
.sub{margin:0;color:var(--muted);max-width:46ch}

.cats{display:flex;flex-wrap:wrap;gap:8px;padding:16px 0 0}
.cat{display:flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:5px 13px 5px 5px;font-weight:600;font-size:15px;min-height:42px}
.cat .num{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--cc);color:var(--on);font-family:var(--f-display);font-size:15px}
.cat[aria-pressed="true"]{border-color:var(--cc);box-shadow:inset 0 0 0 1.5px var(--cc)}
.cat .cnt{font-size:12px;color:var(--muted);font-weight:500}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:5px 13px;font-size:14px;font-weight:600;min-height:36px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips.foods .chip{font-size:13px;min-height:32px;padding:3px 11px}
.rk{margin:0 0 4px;padding:0;list-style:none}
.rk li{display:flex;gap:10px;align-items:baseline;padding:5px 0;border-top:1px solid var(--line);font-size:15px}
.rk li:first-child{border-top:0}
.rk .r{flex:none;width:22px;font-weight:700;color:var(--cc)}
.rk .v{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
.rk h4{margin:10px 0 2px;font-size:13px;color:var(--muted);font-weight:600}
.src{margin-top:8px;font-size:12.5px;color:var(--muted)}
.src a{color:inherit}
.kind{display:inline-block;font-size:12px;font-weight:700;border:1.5px solid var(--cc);color:var(--cc);border-radius:999px;padding:1px 8px;margin-left:6px}

.mapwrap{margin-top:14px}
.mapbox{aspect-ratio:3/2;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--land)}
.mapbox svg{display:block;width:100%;height:100%}
.m-land{fill:var(--land)}
.m-river{fill:none;stroke:var(--water);stroke-width:15;stroke-linecap:round;stroke-linejoin:round}
.m-stream{fill:none;stroke:var(--water);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.m-label{fill:var(--waterink);font-family:var(--f-body);font-weight:600;letter-spacing:.2em}
.pin{cursor:pointer}
.pin .dot,.bubble .dot,.info .dot{stroke:var(--card)}
.pin .ring{fill:none;stroke:var(--ink)}
.pnum,.bnum{fill:var(--on);font-family:var(--f-body);font-weight:600}
.blabel,.ilabel{fill:var(--ink);font-family:var(--f-body);font-weight:600;paint-order:stroke;stroke:var(--land);stroke-linejoin:round}
.bubble{cursor:pointer}
.cap{margin:6px 2px 0;font-size:12px;color:var(--muted)}

.note{margin:12px 0 0;padding:10px 14px;border-left:4px solid var(--cc);background:var(--card);font-size:14px;color:var(--muted);border-radius:0 8px 8px 0}

.list{display:grid;gap:12px;margin-top:14px}
.card{background:var(--card);border-radius:14px;padding:14px 16px 14px 20px;position:relative;border:1px solid var(--line)}
.card::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:5px;border-radius:0 4px 4px 0;background:var(--cc)}
.card.sel{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink)}
.card-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lead{display:flex;align-items:center;gap:8px;min-width:0}
.n{flex:0 0 auto;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--cc);color:var(--on);font-size:13px;font-weight:600}
.tag{font-size:12px;font-weight:600;color:var(--cc)}
.acts{display:flex;align-items:center;margin:-8px -10px -8px 0}
.loc{border:0;background:transparent;color:var(--muted);font-size:13px;font-weight:600;min-height:44px;padding:0 8px;text-decoration:underline;text-underline-offset:3px}
.save{border:0;background:transparent;width:44px;height:44px;display:grid;place-items:center;color:var(--muted)}
.save svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2}
.save[aria-pressed="true"]{color:var(--c-eat)}
.save[aria-pressed="true"] svg{fill:currentColor}
h3{margin:2px 0 6px;font-size:18px;line-height:1.3;font-weight:600}
.desc{margin:0 0 10px}
.tip{margin:0;font-size:14px;color:var(--muted);padding-top:10px;border-top:1px dashed var(--line)}
.tip b{color:var(--ink);font-weight:600;margin-right:6px}
.empty{padding:28px 8px;color:var(--muted);text-align:center}
.foot{margin-top:28px;font-size:13px;color:var(--muted)}
.openrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin-top:12px}
.gbtn{display:inline-flex;align-items:center;min-height:40px;padding:0 16px;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:600;font-size:14px;text-decoration:none}
.alt{font-size:13px;font-weight:600;color:var(--muted);text-underline-offset:3px}
.cap a{color:var(--ink);font-weight:600;text-underline-offset:3px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">로컬픽<small>LOCAL PICK</small></div>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" id="lang-ko" aria-pressed="true">한국어</button>
      <button type="button" id="lang-en" aria-pressed="false">EN</button>
    </div>
  </header>

  <section class="hero">
    <h1 id="h1"></h1>

  <div class="chips" id="chips" aria-label="Neighborhood"></div>
  <div class="chips foods" id="foods" aria-label="Food type"></div>

  <section class="mapwrap" id="mapwrap">
    <div class="mapbox" id="mapbox"></div>
    <p class="cap" id="cap"></p>
    <p class="cap" id="maplink" hidden></p>
  </section>

  <div class="note" id="note"></div>
  <main class="list" id="list"></main>
  <p class="foot" id="foot"></p>
</div>

var CAT_ORDER = ["eat", "do", "cvs", "oy", "rank", "saved"];
var state = { lang: "ko", cat: "eat", area: "all", food: "all", sel: null, saved: [] };

try {
  var sl = localStorage.getItem("lp-lang");
  if (sl === "ko" || sl === "en") state.lang = sl;
  var ss = JSON.parse(localStorage.getItem("lp-saved") || "[]");
  if (Array.isArray(ss)) state.saved = ss;
} catch (e) {}

function persist() {
  try {
    localStorage.setItem("lp-lang", state.lang);
    localStorage.setItem("lp-saved", JSON.stringify(state.saved));
  } catch (e) {}
}
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function areaOf(id) { return AREAS.filter(function (a) { return a.id === id; })[0]; }
function catColor(c) { return "var(--c-" + c + ")"; }
function isGeo() { return state.cat === "eat" || state.cat === "do"; }

/* 1 degree of longitude is about 88 km and 1 degree of latitude about 111 km here, so the map keeps true proportions. */
function proj(lat, lng) { return [(lng - 126.885) * 1714.3, (37.595 - lat) * 2162]; }
function n1(v) { return Math.round(v * 100) / 100; }

function visible() {
  if (state.cat === "saved") return DATA.filter(function (i) { return state.saved.indexOf(i.id) > -1; });
  return DATA.filter(function (i) {
    if (i.cat !== state.cat) return false;
    if (state.cat === "eat" && state.food !== "all" && i.f !== state.food) return false;
    if (isGeo() && state.area !== "all") return i.area === state.area;
    return true;
  });
}

function mapHTML(items) {
  var L = UI[state.lang];
  var vw = (isGeo() && VIEW[state.area]) ? VIEW[state.area] : VIEW.all;
  var z = vw.z, k = 1 / z, c = proj(vw.c[0], vw.c[1]), w = 360 / z, h = 240 / z;
  var s = "<svg viewBox=\"" + n1(c[0] - w / 2) + " " + n1(c[1] - h / 2) + " " + n1(w) + " " + n1(h) + "\" role=\"img\" aria-label=\"" + esc(L.mapLabel) + "\">";
  s += "<rect class=\"m-land\" x=\"-300\" y=\"-300\" width=\"960\" height=\"840\"/>";
  s += "<polyline class=\"m-river\" points=\"" + RIVER.map(function (q) { var p = proj(q[0], q[1]); return n1(p[0]) + "," + n1(p[1]); }).join(" ") + "\"/>";
  s += "<polyline class=\"m-stream\" points=\"" + STREAM.map(function (q) { var p = proj(q[0], q[1]); return n1(p[0]) + "," + n1(p[1]); }).join(" ") + "\"/>";
  [[37.5395, 126.9290], [37.5290, 127.0560], [37.5130, 126.9890]].forEach(function (q) {
    var p = proj(q[0], q[1]);
    s += "<text class=\"m-label\" x=\"" + n1(p[0]) + "\" y=\"" + n1(p[1] + 3) + "\" text-anchor=\"middle\" style=\"font-size:8px\">" + esc(L.river) + "</text>";
  });

  if (state.cat === "oy") {
    OY_SPOTS.forEach(function (o) {
      var p = proj(o.p[0], o.p[1]);
      s += "<g class=\"info\" transform=\"translate(" + n1(p[0]) + " " + n1(p[1]) + ")\">" +
        "<circle class=\"dot\" r=\"" + n1(8 * k) + "\" style=\"fill:var(--c-oy);stroke-width:" + n1(2 * k) + "\"/>" +
        "<text class=\"ilabel\" x=\"" + n1(12 * k) + "\" y=\"" + n1(4 * k) + "\" style=\"font-size:" + n1(12 * k) + "px;stroke-width:" + n1(3 * k) + "px\">" + esc(o[state.lang]) + "</text></g>";
    });
  } else if (isGeo() && state.area === "all") {
    AREAS.slice(1).forEach(function (a) {
      var cnt = items.filter(function (i) { return i.area === a.id; }).length;
      if (!cnt) return;
      var p = proj(VIEW[a.id].b[0], VIEW[a.id].b[1]);
      s += "<g class=\"bubble\" data-bubble=\"" + a.id + "\" tabindex=\"0\" role=\"button\" aria-label=\"" + esc(a[state.lang] + " " + cnt) + "\" transform=\"translate(" + n1(p[0]) + " " + n1(p[1]) + ")\">" +
        "<circle class=\"dot\" r=\"15\" style=\"fill:" + catColor(state.cat) + ";stroke-width:2\"/>" +
        "<text class=\"bnum\" y=\"5\" text-anchor=\"middle\" style=\"font-size:14px\">" + cnt + "</text>" +
        "<text class=\"blabel\" y=\"29\" text-anchor=\"middle\" style=\"font-size:11px;stroke-width:3px\">" + esc(a[state.lang]) + "</text></g>";
    });
  } else if (isGeo()) {
    var order = items.map(function (i, idx) { return { i: i, n: idx + 1 }; });
    order.sort(function (a, b) { return (a.i.id === state.sel) - (b.i.id === state.sel); });
    order.forEach(function (o) {
      var p = proj(o.i.p[0], o.i.p[1]), sel = o.i.id === state.sel, r = (sel ? 15 : 12) * k;
      s += "<g class=\"pin\" data-pin=\"" + o.i.id + "\" tabindex=\"0\" role=\"button\" aria-label=\"" + esc(o.n + ". " + o.i[state.lang][0]) + "\" transform=\"translate(" + n1(p[0]) + " " + n1(p[1]) + ")\">" +
        (sel ? "<circle class=\"ring\" r=\"" + n1(r + 4 * k) + "\" style=\"stroke-width:" + n1(2.5 * k) + "\"/>" : "") +
        "<circle class=\"dot\" r=\"" + n1(r) + "\" style=\"fill:" + catColor(o.i.cat) + ";stroke-width:" + n1(2 * k) + "\"/>" +
        "<text class=\"pnum\" y=\"" + n1(4.5 * k) + "\" text-anchor=\"middle\" style=\"font-size:" + n1(13 * k) + "px\">" + o.n + "</text></g>";
    });
  }
  return s + "</svg>";
}

function render() {
  var L = UI[state.lang];
  document.documentElement.lang = state.lang;
  document.title = state.lang === "ko" ? "서울 로컬픽" : "Seoul Local Pick";
  document.getElementById("h1").textContent = L.h1;
  document.getElementById("sub").textContent = L.sub;
  document.getElementById("foot").textContent = L.foot;
  document.getElementById("cap").textContent = L.cap;
  var gq = (isGeo() && state.area !== "all") ? AREA_GQ[state.area] : null;
  var ml = document.getElementById("maplink");
  ml.hidden = !gq;
  if (gq) ml.innerHTML = "<a href=\"https://www.google.com/maps/search/?api=1&amp;query=" + encodeURIComponent(gq) + "\" target=\"_blank\" rel=\"noopener\">" + esc(L.areaLink) + "</a>";
  document.getElementById("lang-ko").setAttribute("aria-pressed", state.lang === "ko");
  document.getElementById("lang-en").setAttribute("aria-pressed", state.lang === "en");

  document.getElementById("cats").innerHTML = CAT_ORDER.map(function (c, idx) {
    var badge = c === "saved" ? "♥" : String(idx + 1);
    var cnt = c === "saved" ? " <span class=\"cnt\">" + state.saved.length + "</span>" : "";
    return "<button type=\"button\" class=\"cat\" data-cat=\"" + c + "\" style=\"--cc:" + catColor(c) + "\" aria-pressed=\"" + (state.cat === c) + "\">" +
      "<span class=\"num\">" + badge + "</span>" + esc(L.cats[c]) + cnt + "</button>";
  }).join("");

  var chips = document.getElementById("chips");
  chips.hidden = !isGeo();
  if (isGeo()) {
    chips.innerHTML = AREAS.filter(function (a) {
      return a.id === "all" || a.id === state.area || DATA.some(function (i) { return i.cat === state.cat && i.area === a.id && (state.cat !== "eat" || state.food === "all" || i.f === state.food); });
    }).map(function (a) {
      return "<button type=\"button\" class=\"chip\" data-area=\"" + a.id + "\" aria-pressed=\"" + (state.area === a.id) + "\">" + esc(a[state.lang]) + "</button>";
    }).join("");
  }

  var foods = document.getElementById("foods");
  foods.hidden = state.cat !== "eat";
  if (state.cat === "eat") {
    foods.innerHTML = FOODS.map(function (f) {
      return "<button type=\"button\" class=\"chip\" data-food=\"" + f.id + "\" aria-pressed=\"" + (state.food === f.id) + "\">" + esc(f[state.lang]) + "</button>";
    }).join("");
  }

  if (state.cat === "rank") { renderRanks(L); return; }
  var items = visible();
  var showMap = isGeo() || state.cat === "oy";
  document.getElementById("mapwrap").hidden = !showMap;
  if (showMap) document.getElementById("mapbox").innerHTML = mapHTML(items);

  var note = document.getElementById("note");
  note.style.setProperty("--cc", catColor(state.cat));
  note.textContent = L.notes[state.cat];

  var list = document.getElementById("list");
  if (!items.length) {
    list.innerHTML = "<p class=\"empty\">" + esc(L.empty) + "</p>";
    return;
  }
  list.innerHTML = items.map(function (i, idx) {
    var t = i[state.lang];
    var isSaved = state.saved.indexOf(i.id) > -1;
    var geo = i.cat === "eat" || i.cat === "do";
    var tag = geo ? areaOf(i.area)[state.lang === "ko" ? "kl" : "el"] : t[1];
    var num = (geo && state.cat !== "saved") ? "<span class=\"n\">" + (idx + 1) + "</span>" : "";
    var loc = (geo && state.cat !== "saved") ? "<button type=\"button\" class=\"loc\" data-loc=\"" + i.id + "\">" + esc(L.showmap) + "</button>" : "";
    var links = geo ? linkRow(i, L) : "";
    return "<article class=\"card" + (i.id === state.sel ? " sel" : "") + "\" id=\"card-" + i.id + "\" style=\"--cc:" + catColor(i.cat) + "\">" +
      "<div class=\"card-top\"><div class=\"lead\">" + num + "<span class=\"tag\">" + esc(tag) + "</span></div>" +
      "<div class=\"acts\">" + loc +
      "<button type=\"button\" class=\"save\" data-id=\"" + i.id + "\" aria-pressed=\"" + isSaved + "\" aria-label=\"" + esc(isSaved ? L.unsave : L.save) + "\">" +
      "<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M12 21s-7.5-4.6-9.6-9.2C1 8.6 2.9 5 6.3 5c2 0 3.6 1.1 4.4 2.6.3.5.3.5.6 0C12.1 6.1 13.7 5 15.7 5c3.4 0 5.3 3.6 3.9 6.8C19.5 16.4 12 21 12 21z\" stroke-linejoin=\"round\"/></svg></button></div></div>" +
      "<h3>" + esc(t[0]) + "</h3>" +
      "<p class=\"desc\">" + esc(t[2]) + "</p>" +
      "<p class=\"tip\"><b>" + esc(L.memo) + "</b>" + esc(t[3]) + "</p>" + links +
      "</article>";
  }).join("");
}

function renderRanks(L) {
  document.getElementById("mapwrap").hidden = true;
  var note = document.getElementById("note");
  note.style.setProperty("--cc", catColor("rank"));
  note.textContent = L.notes.rank;
  var ko = state.lang === "ko";
  var html = RANKS.map(function (r) {
    var rows = r.items.map(function (it, idx) {
      return "<li>" + (r.kind === "rank" ? "<span class=\"r\">" + (idx + 1) + "</span>" : "<span class=\"r\">·</span>") + "<span>" + esc(it[ko ? 0 : 1]) + "</span>" + (it[2] ? "<span class=\"v\">" + esc(it[2]) + "</span>" : "") + "</li>";
    }).join("");
    return "<article class=\"card\" style=\"--cc:" + catColor("rank") + "\">" +
      "<div class=\"card-top\"><div class=\"lead\"><span class=\"tag\">" + esc(L.asof + " " + r.asof) + "</span><span class=\"kind\">" + esc(r.kind === "rank" ? L.kRank : L.kList) + "</span></div></div>" +
      "<h3>" + esc(ko ? r.ko : r.en) + "</h3>" +
      "<p class=\"desc\">" + esc(ko ? r.n : r.nen) + "</p><ol class=\"rk\" style=\"list-style:none\">" + rows + "</ol>" +
      "<p class=\"src\">" + esc(L.src) + ": <a href=\"" + r.url + "\" target=\"_blank\" rel=\"noopener\">" + esc(ko ? r.src : r.sen) + "</a></p></article>";
  }).join("");
  var oy = ko ? "올리브영: 공식 순위 자료를 찾지 못해서 비워뒀어요. 올리브영 앱의 랭킹 메뉴에서 실시간 순위를 볼 수 있어요." : "Olive Young: I could not find an official ranking, so none is shown. The Olive Young app has a live ranking menu.";
  html += "<article class=\"card\" style=\"--cc:" + catColor("oy") + "\"><h3>" + esc(L.cats.oy) + "</h3><p class=\"desc\">" + esc(oy) + "</p></article>";
  var ct = ko ? "캐치테이블의 지역별 맛집 랭킹은 앱·웹에서 실시간으로 확인할 수 있어요. 데이터를 가져오지 않고 링크로만 연결해요." : "CatchTable shows live restaurant rankings by area in its app and site. This page only links to it and does not copy the data.";
  html += "<article class=\"card\" style=\"--cc:" + catColor("rank") + "\"><h3>CatchTable</h3><p class=\"desc\">" + esc(ct) + "</p><div class=\"openrow\"><a class=\"gbtn\" href=\"https://www.catchtable.net/ranking/location/location-all\" target=\"_blank\" rel=\"noopener\">" + (ko ? "캐치테이블 랭킹 열기" : "Open CatchTable rankings") + "</a></div></article>";
  document.getElementById("list").innerHTML = html;
}

function scrollToEl(id, block) {
  var el = document.getElementById(id);
  if (el && el.scrollIntoView) { try { el.scrollIntoView({ behavior: "smooth", block: block }); } catch (e) { el.scrollIntoView(); } }
}
function selectItem(id, from) {
  var item = DATA.filter(function (i) { return i.id === id; })[0];
  if (!item) return;
  state.sel = id;
  render();
  if (from === "pin") scrollToEl("card-" + id, "center");
  else scrollToEl("mapbox", "start");
}

function setLang(l) {
  state.lang = l;
  persist();
  render();
}

document.addEventListener("click", function (e) {
  var pn = e.target.closest("[data-pin]");
  if (pn) { selectItem(pn.getAttribute("data-pin"), "pin"); return; }
  var bb = e.target.closest("[data-bubble]");
  if (bb) { state.area = bb.getAttribute("data-bubble"); state.sel = null; render(); return; }
  var b = e.target.closest("button");
  if (!b) return;
  if (b.id === "lang-ko") { setLang("ko"); return; }
  if (b.id === "lang-en") { setLang("en"); return; }
  if (b.dataset.cat) { state.cat = b.dataset.cat; state.sel = null; render(); return; }
  if (b.dataset.food) { state.food = b.dataset.food; state.area = "all"; state.sel = null; render(); return; }
  if (b.dataset.area) { state.area = b.dataset.area; state.sel = null; render(); return; }
  if (b.dataset.loc) { selectItem(b.dataset.loc, "card"); return; }
  if (b.dataset.id) {
    var k = state.saved.indexOf(b.dataset.id);
    if (k > -1) state.saved.splice(k, 1); else state.saved.push(b.dataset.id);
    persist(); render();
  }
});
document.addEventListener("keydown", function (e) {
  if (e.key !== "Enter" && e.key !== " ") return;
  var t = e.target.closest ? e.target.closest("[data-pin],[data-bubble]") : null;
  if (t) { e.preventDefault(); t.dispatchEvent(new MouseEvent("click", { bubbles: true })); }
});

render();
</script>
